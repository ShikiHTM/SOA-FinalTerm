groups:
  - name: lms_soa_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.job }}) for more than 1 minute."

      - alert: HighHttp5xxRate
        expr: (sum by (service) (rate(http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1e-9)) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "HTTP 5xx error rate on {{ $labels.service }} exceeded 5% over the last 5 minutes."

      - alert: HighGatewayLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="api-gateway"}[5m]))) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on api-gateway"
          description: "API Gateway p95 request latency has exceeded 1.5 seconds over the last 5 minutes."

      - alert: GradingFailuresDetected
        expr: increase(lms_grading_completed_total{status="FAILED"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Submission grading failures detected"
          description: "One or more submissions transitioned to FAILED during grading in the last 5 minutes."
