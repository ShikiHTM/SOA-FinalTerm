name: LMS-SOA-Project
services:
  assessment_pgsql_db:
    image: postgres:18.6-alpine
    container_name: assessment_pgsql_db
    volumes:
      - assessment_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${ASSESSMENT_PGSQL_DB_USER}
      - POSTGRES_PASSWORD=${ASSESSMENT_PGSQL_DB_PASSWORD}
      - POSTGRES_DB=${ASSESSMENT_PGSQL_DB}
    ports:
      - 3033:5432

  swagger_ui:
    image: swaggerapi/swagger-ui:v5.34.0
    container_name: lms_swagger_ui
    ports:
      - 8080:8080
    environment:
      URLS: >
        [
          { "url": "/applications/assessment-service/docs/openapi.yaml", "name": "Assessment Service" },
          { "url": "/applications/submission-service/docs/openapi.yaml", "name": "Submission Service" }
        ]
    volumes:
      - ./applications:/usr/share/nginx/html/applications:ro
      - ./packages:/usr/share/nginx/html/packages:ro

volumes:
  assessment_data:
