name: LMS-SOA-Project
services:
  user_pgsql_db:
    image: postgres:18.6-alpine
    container_name: user_pgsql_db
    volumes:
      - user_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${USER_DB_USER}
      - POSTGRES_PASSWORD=${USER_DB_PASSWORD}
      - POSTGRES_DB=${USER_DB_NAME}
    ports:
      - 5001:5432

  user_service:
    build:
      context: .
      dockerfile: applications/user-service/Dockerfile
    environment:
      PORT: 3031
      USER_DB_HOST: user_pgsql_db
      USER_DB_PORT: 5432
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_SYNC_SCHEMA: ${USER_DB_SYNC_SCHEMA}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    ports:
      - 3031:3031
    restart: on-failure

  group_pgsql_db:
    image: postgres:18.6-alpine
    container_name: group_pgsql_db
    volumes:
      - group_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${GROUP_DB_USER}
      - POSTGRES_PASSWORD=${GROUP_DB_PASSWORD}
      - POSTGRES_DB=${GROUP_DB_NAME}
    ports:
      - 5002:5432

  group_service:
    build:
      context: .
      dockerfile: applications/group-service/Dockerfile
    environment:
      PORT: 8002
      GROUP_DB_HOST: group_pgsql_db
      GROUP_DB_PORT: 5432
      GROUP_DB_USER: ${GROUP_DB_USER}
      GROUP_DB_PASSWORD: ${GROUP_DB_PASSWORD}
      GROUP_DB_NAME: ${GROUP_DB_NAME}
      GROUP_DB_SYNC_SCHEMA: ${GROUP_DB_SYNC_SCHEMA}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    ports:
      - 8002:8002
    depends_on:
      - group_pgsql_db
    restart: on-failure

  notification_pgsql_db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
    volumes:
      - notification_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification_service:
    build:
      context: .
      dockerfile: applications/notification-service/Dockerfile
    environment:
      PORT: 3037
      NOTIFICATION_DB_HOST: notification_pgsql_db
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_NOTIFICATION_TOPIC: ${KAFKA_NOTIFICATION_TOPIC:-notification.requested.v1}
    ports:
      - 3037:3037
    depends_on:
      notification_pgsql_db:
        condition: service_healthy
    restart: on-failure

  assessment_pgsql_db:
    image: postgres:18.6-alpine
    container_name: assessment_pgsql_db
    volumes:
      - assessment_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${ASSESSMENT_DB_USER:-assessment_service}
      - POSTGRES_PASSWORD=${ASSESSMENT_DB_PASSWORD:-assessment_service_dev}
      - POSTGRES_DB=${ASSESSMENT_DB_NAME:-assessment_db}
    ports:
      - 5003:5432

  assessment_service:
    build:
      context: .
      dockerfile: applications/assessment-service/Dockerfile
    environment:
      PORT: 8003
      ASSESSMENT_DB_HOST: assessment_pgsql_db
      ASSESSMENT_DB_PORT: 5432
      ASSESSMENT_DB_USER: ${ASSESSMENT_DB_USER:-assessment_service}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessment_service_dev}
      ASSESSMENT_DB_NAME: ${ASSESSMENT_DB_NAME:-assessment_db}
      ASSESSMENT_DB_SYNC_SCHEMA: ${ASSESSMENT_DB_SYNC_SCHEMA:-true}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      GROUP_SERVICE_URL: http://group_service:8002
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PRESIGN_EXPIRES_IN_SECONDS: ${S3_PRESIGN_EXPIRES_IN_SECONDS:-900}
      S3_MAX_PDF_BYTES: ${S3_MAX_PDF_BYTES:-20971520}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - 8003:8003
    depends_on:
      - assessment_pgsql_db
    restart: on-failure

  swagger_ui:
    image: swaggerapi/swagger-ui:v5.34.0
    container_name: lms_swagger_ui
    ports:
      - 8080:8080
    environment:
      URLS: >
        [
          { "url": "/applications/user-service/docs/openapi.yaml", "name": "User Service" },
          { "url": "/applications/group-service/docs/openapi.yaml", "name": "Group Service" },
          { "url": "/applications/assessment-service/docs/openapi.yaml", "name": "Assessment Service" },
          { "url": "/applications/submission-service/docs/openapi.yaml", "name": "Submission Service" },
          { "url": "/applications/notification-service/docs/openapi.yaml", "name": "Notification Service" }
        ]
    volumes:
      - ./applications:/usr/share/nginx/html/applications:ro
      - ./packages:/usr/share/nginx/html/packages:ro

volumes:
  user_data:
  group_data:
  assessment_data:
  notification_data:
