name: LMS-SOA-Project
services:
  user_pgsql_db:
    image: postgres:18.6-alpine
    container_name: user_pgsql_db
    volumes:
      - user_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${USER_DB_USER}
      - POSTGRES_PASSWORD=${USER_DB_PASSWORD}
      - POSTGRES_DB=${USER_DB_NAME}
    ports:
      - 5001:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  user_service:
    build:
      context: .
      dockerfile: applications/user-service/Dockerfile
    environment:
      PORT: 3031
      USER_DB_HOST: user_pgsql_db
      USER_DB_PORT: 5432
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_SYNC_SCHEMA: ${USER_DB_SYNC_SCHEMA}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    ports:
      - 3031:3031
    depends_on:
      user_pgsql_db:
        condition: service_healthy
    restart: on-failure

  group_pgsql_db:
    image: postgres:18.6-alpine
    container_name: group_pgsql_db
    volumes:
      - group_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${GROUP_DB_USER}
      - POSTGRES_PASSWORD=${GROUP_DB_PASSWORD}
      - POSTGRES_DB=${GROUP_DB_NAME}
    ports:
      - 5002:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  group_service:
    build:
      context: .
      dockerfile: applications/group-service/Dockerfile
    environment:
      PORT: 8002
      GROUP_DB_HOST: group_pgsql_db
      GROUP_DB_PORT: 5432
      GROUP_DB_USER: ${GROUP_DB_USER}
      GROUP_DB_PASSWORD: ${GROUP_DB_PASSWORD}
      GROUP_DB_NAME: ${GROUP_DB_NAME}
      GROUP_DB_SYNC_SCHEMA: ${GROUP_DB_SYNC_SCHEMA}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    ports:
      - 8002:8002
    depends_on:
      group_pgsql_db:
        condition: service_healthy
    restart: on-failure

  notification_pgsql_db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
    volumes:
      - notification_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification_service:
    build:
      context: .
      dockerfile: applications/notification-service/Dockerfile
    environment:
      PORT: 3037
      NOTIFICATION_DB_HOST: notification_pgsql_db
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_NOTIFICATION_TOPIC: ${KAFKA_NOTIFICATION_TOPIC:-notification.requested.v1}
    ports:
      - 3037:3037
    depends_on:
      notification_pgsql_db:
        condition: service_healthy
    restart: on-failure

  assessment_pgsql_db:
    image: postgres:18.6-alpine
    container_name: assessment_pgsql_db
    volumes:
      - assessment_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${ASSESSMENT_DB_USER:-assessment_service}
      - POSTGRES_PASSWORD=${ASSESSMENT_DB_PASSWORD:-assessment_service_dev}
      - POSTGRES_DB=${ASSESSMENT_DB_NAME:-assessment_db}
    ports:
      - 5003:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  assessment_service:
    build:
      context: .
      dockerfile: applications/assessment-service/Dockerfile
    environment:
      PORT: 8003
      ASSESSMENT_DB_HOST: assessment_pgsql_db
      ASSESSMENT_DB_PORT: 5432
      ASSESSMENT_DB_USER: ${ASSESSMENT_DB_USER:-assessment_service}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessment_service_dev}
      ASSESSMENT_DB_NAME: ${ASSESSMENT_DB_NAME:-assessment_db}
      ASSESSMENT_DB_SYNC_SCHEMA: ${ASSESSMENT_DB_SYNC_SCHEMA:-true}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      GROUP_SERVICE_URL: http://group_service:8002
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PRESIGN_EXPIRES_IN_SECONDS: ${S3_PRESIGN_EXPIRES_IN_SECONDS:-900}
      S3_MAX_PDF_BYTES: ${S3_MAX_PDF_BYTES:-20971520}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - 8003:8003
    depends_on:
      assessment_pgsql_db:
        condition: service_healthy
    restart: on-failure

  contest_pgsql_db:
    image: postgres:18.6-alpine
    container_name: contest_pgsql_db
    volumes:
      - contest_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${CONTEST_DB_USER:-contest_service}
      - POSTGRES_PASSWORD=${CONTEST_DB_PASSWORD:-contest_service_dev}
      - POSTGRES_DB=${CONTEST_DB_NAME:-contest_db}
    ports:
      - 5004:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  contest_service:
    build:
      context: .
      dockerfile: applications/contest-service/Dockerfile
    environment:
      PORT: 8004
      CONTEST_DB_HOST: contest_pgsql_db
      CONTEST_DB_PORT: 5432
      CONTEST_DB_USER: ${CONTEST_DB_USER:-contest_service}
      CONTEST_DB_PASSWORD: ${CONTEST_DB_PASSWORD:-contest_service_dev}
      CONTEST_DB_NAME: ${CONTEST_DB_NAME:-contest_db}
      CONTEST_DB_SYNC_SCHEMA: ${CONTEST_DB_SYNC_SCHEMA:-true}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      GROUP_SERVICE_URL: http://group_service:8002
      ASSESSMENT_SERVICE_URL: http://assessment_service:8003
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - 8004:8004
    depends_on:
      contest_pgsql_db:
        condition: service_healthy
    restart: on-failure

  submission_pgsql_db:
    image: postgres:18.6-alpine
    container_name: submission_pgsql_db
    volumes:
      - submission_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${SUBMISSION_DB_USER:-submission_service}
      - POSTGRES_PASSWORD=${SUBMISSION_DB_PASSWORD:-submission_service_dev}
      - POSTGRES_DB=${SUBMISSION_DB_NAME:-submission_db}
    ports:
      - 5005:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: lms_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - 9092:9092
    restart: on-failure

  submission_service:
    build:
      context: .
      dockerfile: applications/submission-service/Dockerfile
    environment:
      PORT: 8005
      SUBMISSION_DB_HOST: submission_pgsql_db
      SUBMISSION_DB_PORT: 5432
      SUBMISSION_DB_USER: ${SUBMISSION_DB_USER:-submission_service}
      SUBMISSION_DB_PASSWORD: ${SUBMISSION_DB_PASSWORD:-submission_service_dev}
      SUBMISSION_DB_NAME: ${SUBMISSION_DB_NAME:-submission_db}
      SUBMISSION_DB_SSLMODE: ${SUBMISSION_DB_SSLMODE:-disable}
      SUBMISSION_DB_SYNC_SCHEMA: ${SUBMISSION_DB_SYNC_SCHEMA:-true}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      GROUP_SERVICE_URL: http://group_service:8002
      ASSESSMENT_SERVICE_URL: http://assessment_service:8003
      CONTEST_SERVICE_URL: http://contest_service:8004
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_SUBMISSION_TOPIC: ${KAFKA_SUBMISSION_TOPIC:-submission.submitted.v1}
      KAFKA_NOTIFICATION_TOPIC: ${KAFKA_NOTIFICATION_TOPIC:-notification.requested.v1}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-submission-service}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - 8005:8005
    depends_on:
      submission_pgsql_db:
        condition: service_healthy
    restart: on-failure

  api_gateway:
    build:
      context: .
      dockerfile: applications/api-gateway/Dockerfile
    environment:
      PORT: 3000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      USER_SERVICE_URL: http://user_service:3031
      GROUP_SERVICE_URL: http://group_service:8002
      ASSESSMENT_SERVICE_URL: http://assessment_service:8003
      CONTEST_SERVICE_URL: http://contest_service:8004
      SUBMISSION_SERVICE_URL: http://submission_service:8005
      NOTIFICATION_SERVICE_URL: http://notification_service:3037
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - 3000:3000
    depends_on:
      - user_service
      - group_service
      - assessment_service
      - contest_service
      - submission_service
      - notification_service
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: applications/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    ports:
      - ${FRONTEND_PORT:-5173}:80
    depends_on:
      - api_gateway
    restart: on-failure

  swagger_ui:
    image: swaggerapi/swagger-ui:v5.34.0
    container_name: lms_swagger_ui
    ports:
      - 8080:8080
    environment:
      URLS: >
        [
          { "url": "/applications/api-gateway/docs/openapi.yaml", "name": "API Gateway (Public)" },
          { "url": "/applications/user-service/docs/openapi.yaml", "name": "User Service" },
          { "url": "/applications/group-service/docs/openapi.yaml", "name": "Group Service" },
          { "url": "/applications/assessment-service/docs/openapi.yaml", "name": "Assessment Service" },
          { "url": "/applications/contest-service/docs/openapi.yaml", "name": "Contest Service" },
          { "url": "/applications/submission-service/docs/openapi.yaml", "name": "Submission Service" },
          { "url": "/applications/notification-service/docs/openapi.yaml", "name": "Notification Service" }
        ]
    volumes:
      - ./applications:/usr/share/nginx/html/applications:ro
      - ./packages:/usr/share/nginx/html/packages:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-token}

volumes:
  user_data:
  group_data:
  assessment_data:
  contest_data:
  submission_data:
  notification_data:
