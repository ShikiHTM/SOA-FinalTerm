components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: '400 Bad Request - The server cannot process the request due to a client error (e.g., malformed syntax, invalid parameters).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: '401 Unauthorized - Authentication is required or the provided credentials (e.g., token) are invalid/expired.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: '403 Forbidden - The client is authenticated but does not have the necessary permissions to access the requested resource.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '404 Not Found - The requested resource or endpoint could not be found.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: '500 Internal Server Error - An unexpected error occurred on the server side.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
