openapi: 3.0.3
info:
  title: Submission Service API Contract
  version: 2.0.0
  description: API for recording contest and practice submissions, running asynchronous objective grading, and publishing manual essay grades.

servers:
  - url: http://localhost:8005
    description: Local Dev Server
  - url: http://submission_service:8005
    description: Docker Compose Internal Network

tags:
  - name: Submissions
    description: Submission creation, attempt listing, detailed result retrieval, and manual essay grading.
  - name: Observability
    description: Service health status.

components:
  parameters:
    XInternalSecret:
      in: header
      name: X-Internal-Secret
      required: true
      schema:
        type: string
      description: Shared secret for internal service authentication.

    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
        format: uuid
      description: Authenticated user ID.

    XUserRole:
      in: header
      name: X-User-Role
      required: true
      schema:
        $ref: '#/components/schemas/UserSystemRole'
      description: Authenticated user role.

    SubmissionIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Target submission UUID.

    PageQuery:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page number.

    LimitQuery:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items per page.

  responses:
    Conflict:
      description: Request conflicts with submission policy or current grading state.
      content:
        application/json:
          schema:
            $ref: '../../../packages/docs/common/errors.yaml#/components/schemas/ErrorResponse'

    BadGateway:
      description: Upstream dependency service unavailable or failed to process request.
      content:
        application/json:
          schema:
            $ref: '../../../packages/docs/common/errors.yaml#/components/schemas/ErrorResponse'

  schemas:
    UserSystemRole:
      type: string
      enum: [USER, ADMIN]

    SubmissionMode:
      type: string
      enum: [CONTEST, PRACTICE]

    TriggerType:
      type: string
      enum: [MANUAL, AUTO_TIMEOUT]

    GradingStatus:
      type: string
      enum: [QUEUED, AUTO_GRADED, PENDING_MANUAL, GRADED, FAILED]

    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, FILL_IN_THE_BLANK, ESSAY]

    AnswerGradingStatus:
      type: string
      enum: [PENDING, AUTO_GRADED, MANUALLY_GRADED]

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    SubmissionAnswerInput:
      type: object
      required:
        - question_id
        - student_response
      properties:
        question_id:
          type: string
          minLength: 1
          maxLength: 100
        question_type:
          $ref: '#/components/schemas/QuestionType'
        student_response:
          description: Selected option key(s), blank answer text, or essay response.

    CreateSubmissionRequest:
      type: object
      required:
        - submission_mode
        - answers
      properties:
        submission_mode:
          $ref: '#/components/schemas/SubmissionMode'
        trigger_type:
          $ref: '#/components/schemas/TriggerType'
          default: MANUAL
        contest_id:
          type: string
          format: uuid
          nullable: true
          description: Required when submission_mode is CONTEST.
        assessment_id:
          type: string
          format: uuid
          nullable: true
          description: Required when submission_mode is PRACTICE.
        answers:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/SubmissionAnswerInput'

    GradeEssayItemRequest:
      type: object
      required:
        - question_id
        - earned_points
      properties:
        question_id:
          type: string
          minLength: 1
          maxLength: 100
        earned_points:
          type: number
          minimum: 0
        grader_feedback:
          type: string
          maxLength: 4000
          nullable: true

    GradeEssaysRequest:
      type: object
      required:
        - grades
      properties:
        grades:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/GradeEssayItemRequest'

    SubmissionAnswerRecord:
      type: object
      required:
        - id
        - submission_id
        - question_id
        - question_type
        - student_response
        - max_points
        - earned_points
        - is_correct
        - grading_status
        - grader_id
        - grader_feedback
        - graded_at
      properties:
        id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        question_id:
          type: string
        question_type:
          $ref: '#/components/schemas/QuestionType'
        student_response: {}
        expected_answer_snapshot:
          description: Included for practice submissions after grading or when viewed by group managers.
        max_points:
          type: number
        earned_points:
          type: number
          nullable: true
        is_correct:
          type: boolean
          nullable: true
        grading_status:
          $ref: '#/components/schemas/AnswerGradingStatus'
        grader_id:
          type: string
          format: uuid
          nullable: true
        grader_feedback:
          type: string
          nullable: true
        graded_at:
          type: string
          format: date-time
          nullable: true

    SubmissionRecord:
      type: object
      required:
        - id
        - user_id
        - group_id
        - contest_id
        - assessment_id
        - assessment_version
        - submission_mode
        - trigger_type
        - attempt_number
        - is_final_attempt
        - grading_status
        - objective_score
        - essay_score
        - total_score
        - max_score
        - submitted_at
        - auto_graded_at
        - final_graded_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        contest_id:
          type: string
          format: uuid
          nullable: true
        assessment_id:
          type: string
          format: uuid
        assessment_version:
          type: integer
          minimum: 1
        submission_mode:
          $ref: '#/components/schemas/SubmissionMode'
        trigger_type:
          $ref: '#/components/schemas/TriggerType'
        attempt_number:
          type: integer
          minimum: 1
        is_final_attempt:
          type: boolean
        grading_status:
          $ref: '#/components/schemas/GradingStatus'
        objective_score:
          type: number
          nullable: true
        essay_score:
          type: number
          nullable: true
        total_score:
          type: number
          nullable: true
        max_score:
          type: number
        idempotency_key:
          type: string
        submitted_at:
          type: string
          format: date-time
        auto_graded_at:
          type: string
          format: date-time
          nullable: true
        final_graded_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        answers:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionAnswerRecord'

    PaginatedSubmissionList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionRecord'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

paths:
  /health:
    get:
      tags:
        - Observability
      summary: Health check
      description: Returns the service operational status.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: submission-service

  /api/v1/internal/submissions:
    post:
      tags:
        - Submissions
      summary: Submit assessment answers
      description: Validates contest or practice eligibility, records the attempt, and queues asynchronous grading.
      parameters:
        - $ref: '#/components/parameters/XInternalSecret'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional client idempotency key to prevent duplicate submissions on retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '200':
          description: Idempotent replay of a previously recorded submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionRecord'
        '202':
          description: Submission accepted and queued for asynchronous grading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionRecord'
        '400':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/InternalError'

    get:
      tags:
        - Submissions
      summary: List group submissions
      description: Returns paginated submissions for a group on behalf of group managers or administrators.
      parameters:
        - $ref: '#/components/parameters/XInternalSecret'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - in: query
          name: group_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: contest_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: assessment_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: grading_status
          required: false
          schema:
            $ref: '#/components/schemas/GradingStatus'
        - in: query
          name: submission_mode
          required: false
          schema:
            $ref: '#/components/schemas/SubmissionMode'
        - in: query
          name: is_final_attempt
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated group submissions retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionList'
        '400':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/InternalError'

  /api/v1/internal/submissions/me:
    get:
      tags:
        - Submissions
      summary: List own submissions
      description: Returns paginated submission attempts belonging to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/XInternalSecret'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - in: query
          name: group_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: contest_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: assessment_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: grading_status
          required: false
          schema:
            $ref: '#/components/schemas/GradingStatus'
        - in: query
          name: submission_mode
          required: false
          schema:
            $ref: '#/components/schemas/SubmissionMode'
        - in: query
          name: is_final_attempt
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated own submissions retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionList'
        '400':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Unauthorized'
        '500':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/InternalError'

  /api/v1/internal/submissions/{id}:
    get:
      tags:
        - Submissions
      summary: Get submission details
      description: Returns submission scores, grading status, and per-question answer breakdown to the owner or group managers.
      parameters:
        - $ref: '#/components/parameters/XInternalSecret'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/SubmissionIdParam'
      responses:
        '200':
          description: Submission details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionRecord'
        '400':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/InternalError'

  /api/v1/internal/submissions/{id}/grade:
    patch:
      tags:
        - Submissions
      summary: Manually grade essay items
      description: Records essay scores and feedback on behalf of a group manager and unlocks the combined final score once all essays are graded.
      parameters:
        - $ref: '#/components/parameters/XInternalSecret'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/SubmissionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeEssaysRequest'
      responses:
        '200':
          description: Essay grades recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionRecord'
        '400':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '../../../packages/docs/common/errors.yaml#/components/responses/InternalError'
